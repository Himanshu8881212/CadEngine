[package]
name = "kernel-api"
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["LMCAD"]
description = "JSON program binding for the LMCAD hybrid kernel: a non-Rust (AI) caller drives ~30 core capabilities through `kernel-api run program.json`."

[lib]
name = "kernel_api"
path = "src/lib.rs"

[[bin]]
name = "kernel-api"
path = "src/main.rs"

[dependencies]
kernel-core = { path = "../kernel-core" }
kernel-brep = { path = "../kernel-brep" }
kernel-implicit = { path = "../kernel-implicit" }
kernel-model = { path = "../kernel-model" }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["catalog"]
# The hardware-catalog op families no shipped campaign uses (docs/OP_USAGE.md): the unused
# standard parts and catalog feature cuts, the parts library (`library_*`), the lattice ops
# `gyroid_block` / `tpms`, and `sketch_extrude`. On by default, so a normal build is unchanged;
# `--no-default-features` compiles the 52 out and `run` refuses them with `unknown_op`
# naming this feature. The gate is `#[cfg(feature = "catalog")]` on the `OpKind` variants
# (program.rs), their `exec_op` arms (interp.rs) and the generated `describe` tables
# (discover.rs, via tools/gen_discover.py).
catalog = []
