# Pin the toolchain, for the same reason Cargo.lock pins dependencies.
#
# This engine's central claim is that a rebuild reproduces byte-identical
# geometry, and its CI denies clippy warnings. With an unpinned `stable` both
# promises are hostage to whatever toolchain ships on the day: on 2026-09-04 a
# new `clippy::chunks_exact_to_as_chunks` lint turned 27 untouched call sites
# into build errors with no code change. rustfmt's output is toolchain-dependent
# too, so an unpinned formatter would churn the tree on every upgrade.
#
# Upgrading is a deliberate commit: bump `channel`, run the workspace suite,
# clippy and a campaign rebuild, and fix what the new toolchain finds.
[toolchain]
channel = "1.95.0"
components = ["clippy", "rustfmt"]
