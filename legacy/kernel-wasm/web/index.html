<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>LMCAD kernel — WASM viewer</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: #1e1e1e;
				font-family: system-ui, sans-serif;
				color: #ddd;
			}
			#canvas {
				display: block;
				width: 100vw;
				height: 100vh;
			}
			#hud {
				position: fixed;
				top: 12px;
				left: 12px;
				padding: 8px 12px;
				background: rgba(0, 0, 0, 0.5);
				border-radius: 6px;
				font-size: 13px;
				line-height: 1.5;
				pointer-events: none;
			}
		</style>
		<!-- Pin Three.js to an explicit version so the import map is reproducible. -->
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
				}
			}
		</script>
	</head>
	<body>
		<canvas id="canvas"></canvas>
		<div id="hud">LMCAD kernel · loading…</div>
		<script type="module" src="./viewer.js"></script>
	</body>
</html>
