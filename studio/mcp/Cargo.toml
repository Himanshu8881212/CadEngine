[package]
name = "studio-mcp"
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["LMCAD"]
description = "MCP (Model Context Protocol) stdio server exposing the LMCAD hybrid kernel as native Claude Code tools: run_program / describe_api / run_assembly in-process with the kernel, plus ace_fea / ace_optimize / graded_infill (ACE's hex8 reference FEA + SIMP topology optimization via the tools/ Python runners) and render_views (the 12-view vision contact sheet, returned as MCP image content), over line-delimited JSON-RPC 2.0."

[lib]
name = "studio_mcp"
path = "src/lib.rs"

[[bin]]
name = "lmcad-mcp"
path = "src/main.rs"

[dependencies]
kernel-api = { path = "../../crates/kernel-api" }
studio-server = { path = "../server" }
serde = { workspace = true }
serde_json = { workspace = true }
# render_views returns the sheet PNG as MCP image content; base64 is the tiny
# pure-Rust encoder for that payload (chosen over ~20 hand-rolled lines: the
# crate is already ubiquitous, well-tested, and dependency-free).
base64 = "0.22"
