[workspace]
resolver = "2"
members = [
	"crates/kernel-core",
	"crates/kernel-implicit",
	"crates/kernel-brep",
	"crates/kernel-model",
	"crates/kernel-api",
	"crates/agent-bench",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["LMCAD"]

[workspace.dependencies]
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse(print(x)) must be bit-exact for f64 — the byte-stable
# file contracts (persist.rs I3, format.rs I3b/I5, library.rs I7) depend on it.
# Without it serde_json's fast float parse can land 1 ULP off on re-load.
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
approx = "0.5"
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
# Explicit: the agent-facing API relies on std::panic::catch_unwind (interp.rs run_one,
# asm.rs run_assembly) to turn a kernel panic into a structured error instead of crashing
# the shared backend. panic="abort" would silently defeat those guards.
panic = "unwind"
