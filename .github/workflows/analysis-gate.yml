# Hosted-only analyzer registry gate. Untrusted pull-request code never reaches
# persistent infrastructure from this workflow.
name: analysis-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: analysis-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Analyzer registry and provenance contracts
        run: |
          python3 tools/check_ci_security.py
          python3 tools/check_ci_security.py --self-test
          python3 tools/analyzer_registry.py --check
          python3 tools/analyzer_registry.py --check-contract
          python3 tools/analyzer_registry.py --demo
          python3 tools/analyzer_registry.py

      # Hermetic (stdlib-only) validation pins of the Validated rules engines.
      # The ACE physics pins run on the self-hosted physics-gate; these two need
      # no numpy, so the hosted job re-proves them on every PR.
      - name: Rules-engine validation pins (stdlib, hermetic)
        run: |
          python3 tools/validation/tolerance_stack_validation.py
          python3 tools/validation/production_check_validation.py

      # The 2026-09-02 re-organisation left a forwarding shim at every old
      # flat path (tools/<name>.py -> tools/{analyzers,publish,validation,tests}/).
      # Campaign run_all.sh files and the MCP server call the OLD paths, so this
      # proves one shim end to end: same receipt, same exit code.
      - name: Forwarding shims keep the old tool paths working
        run: |
          printf '%s' '{"fit":{"bore":{"nominal":8.5,"tol":0.15},"shaft":{"nominal":8.0,"tol":0.15}}}' > /tmp/shim_job.json
          python3 tools/tolerance_stack.py /tmp/shim_job.json --out /tmp/shim_old.json
          python3 tools/analyzers/tolerance_stack.py /tmp/shim_job.json --out /tmp/shim_new.json
          cmp /tmp/shim_old.json /tmp/shim_new.json

      - name: Every manifest validates against the schema
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import analyzer_registry as registry
          problems = []
          for manifest in sorted(Path('tools/manifests').rglob('*.json')):
              ok, found = registry._manifest_valid(manifest)
              print(('OK   ' if ok else 'FAIL ') + str(manifest))
              problems.extend(found if not ok else [])
          if problems:
              for problem in problems:
                  print('  -', problem)
              raise SystemExit(1)
          PY
