# Hosted-only analyzer registry gate. Untrusted pull-request code never reaches
# persistent infrastructure from this workflow.
name: analysis-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: analysis-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.95.0  # pinned; see rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2

      # The runner-contract gate does not just read source: nine of its forty
      # checks RUN a runner (positive control, refusal exit codes, dry-run,
      # --out atomicity, core_digest stability), and every runner shells out to
      # target/release/kernel-api. Without this build those nine fail as
      # "internal", which is how this job went red on 2026-09-03 while the
      # analyzers themselves were fine.
      - name: Build the engine the runners shell out to
        run: cargo build -p kernel-api --release

      # The contract checks execute real analyzers, and those import numpy/scipy.
      # Without them every behavioural check fails as "internal" (an ImportError
      # surfacing as a runner error) — the second half of why this job went red
      # on 2026-09-03. Same hash-locked set the physics-gate installs, so the
      # hosted and self-hosted jobs agree on versions.
      - name: Install/verify hash-locked Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          pipx install uv || pip install uv
          uv venv --python 3.11 .analysis-venv
          uv pip install --python .analysis-venv/bin/python --require-hashes -r tools/requirements-analysis.lock
          echo "ANALYSIS_PYTHON=$PWD/.analysis-venv/bin/python" >> "$GITHUB_ENV"

      - name: Analyzer registry and provenance contracts
        run: |
          "$ANALYSIS_PYTHON" tools/check_ci_security.py
          "$ANALYSIS_PYTHON" tools/check_ci_security.py --self-test
          "$ANALYSIS_PYTHON" tools/analyzer_registry.py --check
          "$ANALYSIS_PYTHON" tools/analyzer_registry.py --check-contract
          "$ANALYSIS_PYTHON" tools/analyzer_registry.py --demo
          "$ANALYSIS_PYTHON" tools/analyzer_registry.py

      # Hermetic (stdlib-only) validation pins of the Validated rules engines.
      # The ACE physics pins run on the self-hosted physics-gate; these two need
      # no numpy, so the hosted job re-proves them on every PR.
      - name: Rules-engine validation pins (stdlib, hermetic)
        run: |
          "$ANALYSIS_PYTHON" tools/validation/tolerance_stack_validation.py
          "$ANALYSIS_PYTHON" tools/validation/production_check_validation.py

      # The 2026-09-02 re-organisation left a forwarding shim at every old
      # flat path (tools/<name>.py -> tools/{analyzers,publish,validation,tests}/).
      # Campaign run_all.sh files and the MCP server call the OLD paths, so this
      # proves one shim end to end: same receipt, same exit code.
      - name: Forwarding shims keep the old tool paths working
        run: |
          printf '%s' '{"fit":{"bore":{"nominal":8.5,"tol":0.15},"shaft":{"nominal":8.0,"tol":0.15}}}' > /tmp/shim_job.json
          python3 tools/tolerance_stack.py /tmp/shim_job.json --out /tmp/shim_old.json
          python3 tools/analyzers/tolerance_stack.py /tmp/shim_job.json --out /tmp/shim_new.json
          cmp /tmp/shim_old.json /tmp/shim_new.json

      - name: Every manifest validates against the schema
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import analyzer_registry as registry
          problems = []
          for manifest in sorted(Path('tools/manifests').rglob('*.json')):
              ok, found = registry._manifest_valid(manifest)
              print(('OK   ' if ok else 'FAIL ') + str(manifest))
              problems.extend(found if not ok else [])
          if problems:
              for problem in problems:
                  print('  -', problem)
              raise SystemExit(1)
          PY
