# Trusted physics validation. This workflow has no pull_request or
# pull_request_target trigger. The self-hosted runner executes only a protected
# main SHA (or protected main on an explicit manual dispatch).
name: physics-gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physics-gate-main
  cancel-in-progress: false

jobs:
  physics-pins:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: self-hosted
    timeout-minutes: 120
    env:
      LMCAD_REQUIRE_REPRODUCIBLE_ANALYSIS: '1'
      PYTHONPATH: ''
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'refs/heads/main' }}
          persist-credentials: false
          clean: true

      # The solver used to live in a separate ACE checkout, so this job began by
      # verifying that checkout against tools/ACE_REVISION. Since 2026-09-04 the
      # physics is IN THIS REPOSITORY (tools/analyzers/physics/, Apache-2.0 —
      # see its NOTICE), so the pin is the protected main SHA checked out above:
      # there is no second repository left to drift.

      - name: Install/verify hash-locked Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.11 .analysis-venv
          uv pip install --python .analysis-venv/bin/python --require-hashes -r tools/requirements-analysis.lock
          echo "ANALYSIS_PYTHON=$PWD/.analysis-venv/bin/python" >> "$GITHUB_ENV"

      - name: FEA, modal, buckling, optimization, and Kt pins
        run: '"$ANALYSIS_PYTHON" tools/analyzer_registry.py --run-pins'
