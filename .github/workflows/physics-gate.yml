# Trusted physics validation. This workflow has no pull_request or
# pull_request_target trigger. The self-hosted runner executes only a protected
# main SHA (or protected main on an explicit manual dispatch).
name: physics-gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physics-gate-main
  cancel-in-progress: false

jobs:
  physics-pins:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # Hosted since 2026-09-04. This job was self-hosted for ONE reason: the
    # solvers lived in a private ACE checkout that only the maintainer's machine
    # had. That is no longer true — the physics is in-tree at
    # tools/analyzers/physics/ — and meanwhile the repository had zero
    # self-hosted runners registered, so this gate never ran at all and hid two
    # real defects. A gate that cannot run is not a gate.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LMCAD_REQUIRE_REPRODUCIBLE_ANALYSIS: '1'
      PYTHONPATH: ''
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'refs/heads/main' }}
          persist-credentials: false
          clean: true

      # The solver used to live in a separate ACE checkout, so this job began by
      # verifying that checkout against tools/ACE_REVISION. Since 2026-09-04 the
      # physics is IN THIS REPOSITORY (tools/analyzers/physics/, Apache-2.0 —
      # see its NOTICE), so the pin is the protected main SHA checked out above:
      # there is no second repository left to drift.

      - uses: dtolnay/rust-toolchain@1.95.0  # pinned; see rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2

      # The pins drive real analyses, and every analyzer shells out to the engine.
      - name: Build the engine the pins analyse
        run: cargo build -p kernel-api --release

      - name: Install/verify hash-locked Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          pipx install uv || pip install uv
          uv venv --python 3.11 .analysis-venv
          uv pip install --python .analysis-venv/bin/python --require-hashes -r tools/requirements-analysis.lock
          echo "ANALYSIS_PYTHON=$PWD/.analysis-venv/bin/python" >> "$GITHUB_ENV"

      # LMCAD_ANALYSIS_PYTHON so the registry launches each pin with the LOCKED
      # interpreter, not whatever python happens to be running it.
      - name: FEA, modal, buckling, optimization, and Kt pins
        env:
          LMCAD_ANALYSIS_PYTHON: ${{ env.ANALYSIS_PYTHON }}
        run: '"$ANALYSIS_PYTHON" tools/analyzer_registry.py --run-pins'
