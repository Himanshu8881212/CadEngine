# Hosted Rust/kernel CI. Physics validation is intentionally isolated in
# physics-gate.yml, whose trigger set contains no pull-request event.
name: engine

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Cargo test (workspace, release, every target)
        run: cargo test --workspace --release --all-targets
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --release -- -D warnings
      - name: Manufacturing gallery acceptance and serialized round-trip gate
        run: cargo run --example parts_gallery -p kernel-model --release
